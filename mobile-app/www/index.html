<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoop Manager</title>
<!-- Page de lancement de l'appli native (Capacitor). Le jeu lui-même reste
     servi par le serveur (Render) : cette page ne fait que retenir le lien
     d'invitation du manager (jeton ?m=) puis ouvrir le jeu avec. Sans jeton,
     l'appli ouvrirait le jeu hors de la ligue partagée. -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d131d; color: #eef2f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  main { width: 100%; max-width: 380px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: #9aa8bd; font-size: 15px; line-height: 1.45; margin: 0 0 22px; }
  label { display: block; text-align: left; font-size: 13px; color: #9aa8bd; margin-bottom: 8px; }
  input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 14px 16px; border-radius: 14px;
    border: 1px solid #26334a; background: #141c29; color: #eef2f7; outline: none; }
  input:focus { border-color: #f0a23c; }
  button { width: 100%; margin-top: 14px; font-size: 16px; font-weight: 800; padding: 14px; border: 0; border-radius: 999px;
    background: #f0a23c; color: #3a2506; }
  .err { color: #f58a76; font-size: 14px; min-height: 20px; margin-top: 12px; }
  .loading main > *:not(img):not(.wait) { display: none; }
  .wait { display: none; color: #9aa8bd; margin-top: 16px; }
  .loading .wait { display: block; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Hoop Manager">
  <h1>Bienvenue sur Hoop Manager</h1>
  <p>Colle le lien d'invitation reçu pour ta ligue. L'appli s'en souviendra, tu n'auras à le faire qu'une fois.</p>
  <form id="f">
    <label for="link">Lien d'invitation</label>
    <input id="link" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…/?m=…" required>
    <button type="submit">Ouvrir mon club</button>
  </form>
  <div class="err" id="err" role="alert"></div>
  <div class="wait">Ouverture de ton club…</div>
</main>
<script>
  var SERVER = "https://pullup-030q.onrender.com";
  var KEY = "hoopManagerToken";
  var TOKEN_RE = /^[A-Za-z0-9_-]{1,128}$/;

  function open(token) {
    document.body.classList.add("loading");
    window.location.replace(SERVER + "/?m=" + encodeURIComponent(token));
  }

  function extractToken(text) {
    text = (text || "").trim();
    if (TOKEN_RE.test(text)) return text;
    try { var m = new URL(text).searchParams.get("m"); return m && TOKEN_RE.test(m) ? m : null; } catch (e) { return null; }
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved && TOKEN_RE.test(saved)) open(saved);

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var token = extractToken(document.getElementById("link").value);
    if (!token) { document.getElementById("err").textContent = "Ce lien ne contient pas de code manager (?m=…)."; return; }
    try { localStorage.setItem(KEY, token); } catch (e2) {}
    open(token);
  });
</script>
</body>
</html>
